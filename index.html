<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#161616">
  <title>Laser Pointer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>

  <!-- ── Toolbar ── -->
  <header class="toolbar" id="main-toolbar">
    <span class="app-logo">Laser Pointer</span>

    <div class="toolbar-group">
      <button id="btn-camera" data-tooltip="Start webcam">Start Camera</button>
      <button id="btn-capture-ref" disabled data-tooltip="Capture reference frame for background subtraction">Capture Reference</button>
    </div>

    <div class="toolbar-group">
      <button class="icon-btn active" id="tool-select" data-tool="select" data-tooltip="Select / Move">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l9 4.5-4 1.5-1.5 4z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="currentColor" fill-opacity=".15"/></svg>
      </button>
      <button class="icon-btn" id="tool-rect" data-tool="rect" data-tooltip="Rectangle zone">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="3" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="icon-btn" id="tool-ellipse" data-tool="ellipse" data-tooltip="Ellipse zone">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><ellipse cx="7" cy="7" rx="5" ry="4" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="icon-btn" id="tool-polygon" data-tool="polygon" data-tooltip="Polygon zone (double-click to close)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polygon points="7,2 12,9 2,9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="tool-brush" data-tool="brush" data-tooltip="Freehand brush zone">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 11c1-1 3-3 5-5M8 6l2-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="3.5" cy="11" r="1.2" fill="currentColor" opacity=".6"/></svg>
      </button>
      <div class="divider"></div>
      <button class="icon-btn" id="btn-delete-zone" data-tooltip="Delete selected zone" disabled>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.8 7.5h6.4L11 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="toolbar-group">
      <button id="btn-detect" disabled data-tooltip="Toggle laser detection">Detection Off</button>
    </div>

    <div class="toolbar-group" style="margin-left:auto; border-right:none;">
      <button id="btn-present" data-tooltip="Open presenter view">Present</button>
      <button id="btn-export" data-tooltip="Export to ZIP">Export ZIP</button>
    </div>
  </header>

  <!-- ── Workspace ── -->
  <main class="workspace">

    <!-- Webcam panel -->
    <div class="webcam-panel" id="webcam-panel">
      <div class="video-wrapper" id="video-wrapper">
        <video id="video-el" autoplay muted playsinline></video>
        <canvas id="overlay-canvas"></canvas>
        <canvas id="laser-canvas"></canvas>
        <div class="no-camera-placeholder" id="no-camera">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M8 14h6l4-6h12l4 6h6a2 2 0 012 2v20a2 2 0 01-2 2H8a2 2 0 01-2-2V16a2 2 0 012-2z" stroke="currentColor" stroke-width="2"/>
            <circle cx="24" cy="26" r="7" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>No camera active</span>
          <small>Click "Start Camera" to begin</small>
        </div>
        <div class="polygon-hint hidden" id="polygon-hint">Click to add points — double-click to close polygon</div>
        <div class="active-zone-label hidden" id="active-zone-label"></div>
      </div>

      <div class="video-toolbar">
        <div class="detection-dot" id="detection-dot"></div>
        <span id="status-detection" style="color:var(--text-muted);font-size:11px;">No laser detected</span>
        <span style="margin-left:auto; color:var(--text-muted); font-size:11px;" id="status-fps">0 fps</span>
        <span style="margin-left:12px; color:var(--text-muted); font-size:11px;" id="status-zone">—</span>
      </div>
    </div>

    <div class="resizer" id="panel-resizer"></div>

    <!-- Side panel -->
    <div class="side-panel" id="side-panel">

      <!-- Zones section -->
      <div class="panel-section zones-panel" style="flex:1;min-height:0;">
        <div class="panel-header">
          <span class="panel-header-title">Zones</span>
          <button class="icon-btn" id="btn-add-zone" data-tooltip="Add new zone">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="panel-body" id="zones-list"></div>
      </div>

      <!-- Zone editor section (shown when zone selected) -->
      <div class="panel-section" id="zone-editor-section" style="display:none;">
        <div class="panel-header">
          <span class="panel-header-title">Zone Properties</span>
        </div>
        <div class="panel-body" style="display:flex;flex-direction:column;gap:10px;">
          <div class="field-row">
            <label for="input-zone-name">Name</label>
            <input type="text" id="input-zone-name" placeholder="Zone name">
          </div>
          <div class="field-row">
            <label for="input-zone-url">URL</label>
            <input type="url" id="input-zone-url" placeholder="https://example.com">
          </div>
          <div class="field-row">
            <label>Color</label>
            <div class="color-swatches" id="color-swatches"></div>
          </div>
          <div style="display:flex;gap:6px;margin-top:4px;">
            <button id="btn-apply-zone" class="primary" style="flex:1;">Apply</button>
          </div>
        </div>
      </div>

      <!-- Settings section -->
      <div class="panel-section settings-panel">
        <div class="panel-header">
          <span class="panel-header-title">Settings</span>
        </div>
        <div class="panel-body">

          <div class="setting-row">
            <div class="setting-label-row">
              <label>Red Threshold</label>
              <span class="setting-value" id="val-red-threshold">150</span>
            </div>
            <input type="range" id="slider-red-threshold" min="50" max="254" value="150">
          </div>

          <div class="setting-row">
            <div class="setting-label-row">
              <label>Min Pixel Count</label>
              <span class="setting-value" id="val-min-pixels">3</span>
            </div>
            <input type="range" id="slider-min-pixels" min="1" max="50" value="3">
          </div>

          <div class="setting-row">
            <div class="setting-label-row">
              <label>Debounce Focus (ms)</label>
              <span class="setting-value" id="val-debounce-focus">400</span>
            </div>
            <input type="range" id="slider-debounce-focus" min="50" max="2000" step="50" value="400">
          </div>

          <div class="setting-row">
            <div class="setting-label-row">
              <label>Debounce Switch (ms)</label>
              <span class="setting-value" id="val-debounce-switch">1500</span>
            </div>
            <input type="range" id="slider-debounce-switch" min="100" max="5000" step="100" value="1500">
          </div>

          <div class="setting-row">
            <div class="setting-label-row">
              <label>Message Duration (ms)</label>
              <span class="setting-value" id="val-debounce-msg">3000</span>
            </div>
            <input type="range" id="slider-debounce-msg" min="500" max="8000" step="100" value="3000">
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- ── Status bar ── -->
  <footer class="status-bar">
    <span class="status-item">
      <span class="status-label">Tool:</span>
      <span class="status-val" id="sb-tool">Select</span>
    </span>
    <span class="status-item">
      <span class="status-label">Zones:</span>
      <span class="status-val" id="sb-zones">0</span>
    </span>
    <span class="status-item">
      <span class="status-label">Position:</span>
      <span class="status-val" id="sb-pos">—</span>
    </span>
    <span class="status-item" style="margin-left:auto;">
      <span class="status-label">PWA</span>
      <span class="status-val" id="sb-pwa">installing...</span>
    </span>
  </footer>

  <!-- ── Zone creation modal ── -->
  <div class="modal-backdrop hidden" id="zone-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">New Zone</span>
        <button class="icon-btn" id="modal-close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <label for="modal-zone-name">Zone Name</label>
          <input type="text" id="modal-zone-name" placeholder="e.g. Product Demo">
        </div>
        <div class="field-row">
          <label for="modal-zone-url">URL to display</label>
          <input type="url" id="modal-zone-url" placeholder="https://example.com">
        </div>
        <div class="field-row">
          <label>Zone Color</label>
          <div class="color-swatches" id="modal-color-swatches"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm" class="primary">Create Zone</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <script src="jszip.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
